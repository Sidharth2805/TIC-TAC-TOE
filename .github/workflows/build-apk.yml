name: Build Android APK and Desktop Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop JAR (Java 23)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '23'

      - name: Build Executable JAR with Maven
        run: |
          mvn clean package -DskipTests
          mkdir -p dist-desktop
          cp target/tictactoe-machine-1.0-SNAPSHOT.jar dist-desktop/TicTacToe-Machine-v1.0.jar

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TicTacToe-Machine-Desktop-JAR
          path: dist-desktop/TicTacToe-Machine-v1.0.jar

  build-android:
    name: Build Android APK (Capacitor)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Sync Web Assets to Android Project
        run: node build.js

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
          cd ..
          mkdir -p dist-android
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-android/TicTacToe-Machine-Android.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TicTacToe-Machine-Android-APK
          path: dist-android/TicTacToe-Machine-Android.apk

  publish-release:
    name: Publish to GitHub Releases
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Desktop Artifact
        uses: actions/download-artifact@v4
        with:
          name: TicTacToe-Machine-Desktop-JAR
          path: release-files

      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: TicTacToe-Machine-Android-APK
          path: release-files

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Tic-Tac-Toe Machine v1.0.0
          body: |
            ### 🎮 Tic-Tac-Toe Machine v1.0.0

            #### Available Downloads:
            - 📱 **Android**: Download `TicTacToe-Machine-Android.apk` and tap to install on your phone.
            - 💻 **Desktop (Windows / Mac / Linux)**: Download `TicTacToe-Machine-v1.0.jar` (requires Java 21+).
            - 🌐 **Instant Web Play**: [https://Sidharth2805.github.io/TIC-TAC-TOE/](https://Sidharth2805.github.io/TIC-TAC-TOE/)
          draft: false
          prerelease: false
          files: |
            release-files/TicTacToe-Machine-Android.apk
            release-files/TicTacToe-Machine-v1.0.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
