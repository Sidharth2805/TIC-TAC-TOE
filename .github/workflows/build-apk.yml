name: Build Android APK and Desktop Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Desktop Executable JAR with Maven
        run: |
          mvn clean package -DskipTests
          mkdir -p release-artifacts
          cp target/tictactoe-machine-1.0-SNAPSHOT.jar release-artifacts/TicTacToe-Machine-v1.0.jar

      - name: Install Node Dependencies
        run: npm install

      - name: Sync Web Assets to Android Project
        run: npm run build

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/TicTacToe-Machine-Android.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TicTacToe-Machine-Android-APK
          path: release-artifacts/TicTacToe-Machine-Android.apk

      - name: Upload Desktop JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TicTacToe-Machine-Desktop-JAR
          path: release-artifacts/TicTacToe-Machine-v1.0.jar

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.0.0
          name: Tic-Tac-Toe Machine v1.0.0
          body: |
            ### 🎮 Tic-Tac-Toe Machine v1.0.0

            #### Available Downloads:
            - 📱 **Android**: Download `TicTacToe-Machine-Android.apk` and install directly on your phone.
            - 💻 **Desktop (Windows / Mac / Linux)**: Download `TicTacToe-Machine-v1.0.jar` (requires Java 21+).
            - 🌐 **Instant Web Play**: [https://Sidharth2805.github.io/TIC-TAC-TOE/](https://Sidharth2805.github.io/TIC-TAC-TOE/)
          draft: false
          prerelease: false
          files: |
            release-artifacts/TicTacToe-Machine-Android.apk
            release-artifacts/TicTacToe-Machine-v1.0.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
